---
- name: Update and Upgrade (Basic - No Kernel)
  hosts: debian_hosts
  become: true
  serial: 1

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        force_apt_get: yes
      register: update_result

    - name: Show apt update status
      ansible.builtin.debug:
        msg: "Cache updated: {{ update_result.changed }} | {{ update_result.msg | default('No output') }}"
      when: update_result.changed or update_result.msg is defined

    - name: Upgrade all packages (Basic Upgrade - Skips Kernel)
      ansible.builtin.apt:
        upgrade: yes
        force_apt_get: yes
        autoremove: yes
        clean: yes
      register: upgrade_result

    - name: Show apt upgrade status
      ansible.builtin.debug:
        msg: "Packages upgraded: {{ upgrade_result.changed }} | {{ upgrade_result.msg | default('No output') }}"
      when: upgrade_result.changed or upgrade_result.msg is defined


