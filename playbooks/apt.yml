---
- name: Update and Upgrade (Basic - No Kernel)
  hosts: debian_hosts
  become: true
  serial: 1

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        force_apt_get: yes
      register: update_result

    - name: Show apt update status
      ansible.builtin.debug:
        msg: "Cache updated: {{ update_result.changed }} | {{ update_result.msg | default('No output') }}"
      when: update_result.changed or update_result.msg is defined

    - name: Upgrade all packages (Basic Upgrade - Skips Kernel)
      ansible.builtin.apt:
        upgrade: yes
        force_apt_get: yes
        autoremove: yes
        clean: yes
      register: upgrade_result

    - name: Get package versions before upgrade
      ansible.builtin.command: dpkg-query -W -f='${Package} ${Version}\n'
      register: pkg_before
      changed_when: false
      failed_when: false
      when: upgrade_result is changed

    - name: Get package versions after upgrade
      ansible.builtin.command: dpkg-query -W -f='${Package} ${Version}\n'
      register: pkg_after
      changed_when: false
      failed_when: false
      when: upgrade_result is changed

    - name: Show exactly which packages were upgraded
      ansible.builtin.debug:
        msg: "Packages upgraded:\n{{ pkg_after.stdout_lines | difference(pkg_before.stdout_lines) | join('\n') }}"
      when:
        - upgrade_result is changed
        - pkg_before.stdout_lines is defined
        - pkg_after.stdout_lines is defined

